# Compile la maquette et publie le résultat sur la branche gh-pages,
# que GitHub Pages sert (Settings > Pages > Deploy from a branch > gh-pages).
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm install plutôt que npm ci : le fichier de verrouillage vient d'un Mac et npm ci le refuse sous Linux.
      - run: npm install
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
